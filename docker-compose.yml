services:
  postgres:
    image: postgres:16-alpine
    container_name: ambit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ambit
      # Local dev only. Read from the environment; never commit or reuse this value
      # on any non-loopback host. For shared/staging/prod use docker-compose.deploy.yml,
      # which requires POSTGRES_PASSWORD from the environment (${POSTGRES_PASSWORD:?...}).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambit-local-dev-only}
      POSTGRES_DB: ambit
    ports:
      - '5432:5432'
    volumes:
      - ambit-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ambit -d ambit']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ambit-pg-data:
