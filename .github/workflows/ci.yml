name: CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4
        with:
          node-version: 24.12.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup v4
        with:
          version: 11.20.0
      - run: pnpm install --frozen-lockfile --trust-lockfile --ignore-scripts
      - name: Generate Prisma client
        run: pnpm --filter @ambit/db db:generate
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm -r lint
      - name: Test
        run: pnpm -r test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup v4
        with:
          version: 11.20.0
      - run: pnpm install --frozen-lockfile --trust-lockfile --ignore-scripts
      - name: Dependency audit (high+ security gate)
        # Fails the build on any critical/high advisory EXCEPT the two documented,
        # unfixable exceptions in AUDIT.md (AMB-1): tmp (solc-pinned, dev-only) and
        # bigint-buffer (PancakeSwap Solana SDK, unused on BSC, no patched release).
        run: |
          pnpm audit --audit-level=high --json > audit.json || true
          node -e "const j=require('./audit.json');const a=j.advisories||{};const bad=Object.keys(a).filter(k=>['critical','high'].includes(a[k].severity)&&!['tmp','bigint-buffer'].includes(a[k].module_name));if(bad.length){console.error('Unexpected high/critical advisories:',bad);process.exit(1);}console.log('Security gate passed: only documented exceptions remain.');"
      - name: Contract static analysis gate (AMB-4)
        # In-repo static invariants compiled with the pinned solc: no
        # selfdestruct/delegatecall/external-call escape, rotatable (non-immutable)
        # publisher, and the ABI-parity + Merkle verification surface. Slither is the
        # recommended deeper gate (see AUDIT.md); this runs deterministically with no
        # network install and records its output in the CI log.
        run: pnpm --filter @ambit/contracts test --reporter=verbose

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # docker/setup-buildx-action v3
      - name: Build API image
        run: docker build --target api --tag ambit-api:ci .
      - name: Build indexer image
        run: docker build --target indexer --tag ambit-indexer:ci .
      - name: Build web image
        run: >-
          docker build --target web
          --build-arg NEXT_PUBLIC_API_URL=http://api.example
          --tag ambit-web:ci .
