name: CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - run: pnpm install --frozen-lockfile --trust-lockfile --ignore-scripts
      - name: Generate Prisma client
        run: pnpm --filter @ambit/db db:generate
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm -r lint
      - name: Test
        run: pnpm -r test

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build --target api --tag ambit-api:ci .
      - name: Build indexer image
        run: docker build --target indexer --tag ambit-indexer:ci .
      - name: Build web image
        run: >-
          docker build --target web
          --build-arg NEXT_PUBLIC_API_URL=http://api.example
          --tag ambit-web:ci .
